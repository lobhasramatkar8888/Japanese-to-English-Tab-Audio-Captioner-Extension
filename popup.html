<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Live Translator</title>
    <style>
      :root {
        --bg: #0f172a;
        --bg-soft: #111f3d;
        --text: #f8fafc;
        --muted: #bfdbfe;
        --accent: #f59e0b;
        --accent-2: #34d399;
        --danger: #ef4444;
      }

      body {
        margin: 0;
        padding: 14px;
        width: 330px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 20%, #1e3a8a 0%, transparent 45%),
          radial-gradient(circle at 85% 0%, #7c2d12 0%, transparent 36%),
          linear-gradient(160deg, var(--bg), var(--bg-soft));
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      p {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .card {
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 10px;
      }

      .grid {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }

      label {
        display: grid;
        gap: 4px;
        font-size: 12px;
      }

      input,
      select {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(15, 23, 42, 0.8);
        color: var(--text);
        border-radius: 8px;
        padding: 8px;
        font-size: 12px;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      button {
        flex: 1;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        padding: 10px;
        cursor: pointer;
      }

      #start {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0f172a;
      }

      #stop {
        background: var(--danger);
        color: #fff;
      }

      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 16px;
      }

      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: #d1d5db;
      }
    </style>
  </head>
  <body>
    <h1>JA -> EN Live Translator</h1>
    <p>Listen to active tab audio and overlay translated subtitles.</p>

    <div class="card">
      <div class="grid">
        <label>
          Source speech locale
          <select id="sourceLang">
            <option value="ja-JP" selected>Japanese (ja-JP)</option>
            <option value="ja">Japanese (ja)</option>
          </select>
        </label>

        <label>
          Target language code
          <input id="targetLang" value="en" />
        </label>

        <label>
          Translation provider
          <select id="provider">
            <option value="mymemory" selected>MyMemory (free)</option>
            <option value="libre">LibreTranslate</option>
          </select>
        </label>

        <label>
          Local transcription backend URL
          <input id="backendUrl" value="http://127.0.0.1:5000/transcribe" />
        </label>

        <label>
          LibreTranslate endpoint
          <input id="libreUrl" value="https://libretranslate.com/translate" />
        </label>

        <label>
          Libre API key (optional)
          <input id="libreApiKey" value="" />
        </label>
      </div>

      <div class="row">
        <button id="start">Start</button>
        <button id="stop">Stop</button>
      </div>

      <div id="status"></div>
    </div>

    <div class="hint">
      Tip: On local video files, enable "Allow access to file URLs" for this extension.
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
